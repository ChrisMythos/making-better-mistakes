name: better_mistakes
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.12  # Python 3.12 is well-supported by most packages now
  - pip
  - numpy>=1.26.0  # Fully compatible with Python 3.12
  - pytorch=2.2.0  # Latest stable version compatible with Python 3.12
  - torchvision
  - nltk>=3.8.1
  - protobuf=4.23.4  # Updated from 3.20.3
  - git-lfs
  - tensorboard
  - pyyaml
  - matplotlib
  - plotly
  - pip:
    - fasttext-wheel
    - conditional
    - pillow>=10.0.0
    - urllib3>=2.0.0
    - chardet>=5.0.0
    - charset-normalizer>=3.0.0
    - tensorflow==2.16.1
